{% extends "base.html" %}

{% block title %}Şifre Sıfırla - FlowerShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">
                    <i class="bi bi-shield-lock-fill"></i> Yeni Şifre Belirle
                </h3>
                
                <p class="text-muted text-center mb-4">
                    Lütfen yeni şifrenizi girin.
                </p>
                
                <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                    <div class="mb-3">
                        <label for="password" class="form-label">Yeni Şifre</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6" placeholder="En az 6 karakter">
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Şifre Tekrar</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6" placeholder="Şifreyi tekrar girin">
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle-fill"></i> Şifreyi Değiştir
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <p class="text-center mb-0">
                    <a href="{{ url_for('auth.login') }}">
                        <i class="bi bi-arrow-left"></i> Giriş sayfasına dön
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
