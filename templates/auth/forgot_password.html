{% extends "base.html" %}

{% block title %}Şifremi Unuttum - FlowerShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">
                    <i class="bi bi-key-fill"></i> Şifremi Unuttum
                </h3>
                
                <p class="text-muted text-center mb-4">
                    E-posta adresinizi girin, size şifre sıfırlama linki gönderelim.
                </p>
                
                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-posta Adresi</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="ornek@email.com">
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-envelope-fill"></i> Sıfırlama Linki Gönder
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <p class="text-center mb-0">
                    <a href="{{ url_for('auth.login') }}">
                        <i class="bi bi-arrow-left"></i> Giriş sayfasına dön
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
